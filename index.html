<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gbénu — Digital knowledge is yours</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --iv: #faf7f2;
                --ivd: #f0ebe1;
                --bd: #e8640a;
                --bdl: #f07b28;
                --bdp: #fef0e4;
                --gd: #1a8fa0;
                --gdp: #e4f4f7;
                --ch: #1a1a1a;
                --gr: #6b6b6e;
                --gn: #1d9e75;
                --gnl: #e8f7f2;
                --wh: #fff;
                --br: #e2d8cc;
                --er: #d64545;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: Inter, sans-serif;
                background: var(--iv);
                color: var(--ch);
                min-height: 100vh;
            }
            svg.i {
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
                vertical-align: -0.18em;
                flex-shrink: 0;
            }
            button {
                font-family: inherit;
            }
            a.btn {
                text-decoration: none;
            }
            .nav {
                background: var(--wh);
                border-bottom: 1px solid var(--br);
                padding: 0 20px;
                height: 68px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                position: sticky;
                top: 0;
                z-index: 50;
            }
            .nav img {
                height: 30px;
                display: block;
            }
            .tag {
                font-size: 10px;
                color: var(--bd);
                font-weight: 700;
            }
            .lb {
                position: relative;
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 8px 12px;
                border: 1px solid var(--br);
                border-radius: 8px;
                cursor: pointer;
                font-size: 13px;
                background: var(--wh);
            }
            .ld {
                position: absolute;
                top: 110%;
                right: 0;
                background: var(--wh);
                border: 1px solid var(--br);
                border-radius: 10px;
                min-width: 170px;
                display: none;
                z-index: 60;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
                overflow: hidden;
            }
            .ld.o {
                display: block;
            }
            .ld div {
                padding: 10px 14px;
                font-size: 13px;
                cursor: pointer;
            }
            .ld div:hover,
            .ld .a {
                background: var(--bdp);
            }
            .pb {
                background: var(--wh);
                border-bottom: 1px solid var(--br);
                padding: 8px 20px;
                display: none;
            }
            .pb.s {
                display: block;
            }
            .pt {
                height: 4px;
                background: var(--br);
                border-radius: 2px;
                overflow: hidden;
                margin-bottom: 5px;
            }
            .pf {
                height: 100%;
                background: linear-gradient(90deg, var(--bd), var(--gd));
                transition: width 0.5s;
            }
            .pl {
                font-size: 12px;
                color: var(--gr);
                display: flex;
                justify-content: space-between;
            }
            .app {
                display: grid;
                grid-template-columns: 1fr 330px;
                min-height: calc(100vh - 68px);
            }
            .main {
                background: var(--wh);
                display: flex;
                flex-direction: column;
                border-right: 1px solid var(--br);
            }
            .hd {
                padding: 24px 32px 14px;
                border-bottom: 1px solid var(--ivd);
            }
            .hd h1 {
                font-family: Sora, sans-serif;
                font-size: 22px;
                font-weight: 800;
            }
            .hd p {
                font-size: 13px;
                color: var(--gr);
                margin-top: 4px;
                line-height: 1.5;
            }
            .ct {
                flex: 1;
                padding: 24px 32px;
                overflow-y: auto;
            }
            .ft {
                padding: 14px 32px;
                border-top: 1px solid var(--ivd);
                display: flex;
                gap: 10px;
                justify-content: space-between;
                position: sticky;
                bottom: 0;
                background: var(--wh);
            }
            .mp {
                background: var(--ivd);
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .sh {
                width: 270px;
                background: #1c1c1e;
                border-radius: 36px;
                padding: 10px;
            }
            .sc {
                background: var(--iv);
                border-radius: 26px;
                overflow: hidden;
                min-height: 440px;
            }
            .sb {
                background: var(--bd);
                padding: 10px 14px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                color: #fff;
            }
            .sb img {
                height: 24px;
            }
            .btn {
                border: none;
                border-radius: 10px;
                padding: 13px 22px;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
            .bp {
                background: var(--bd);
                color: #fff;
            }
            .bp:hover {
                background: var(--bdl);
            }
            .bp:disabled {
                background: var(--br);
                color: #999;
                cursor: not-allowed;
            }
            .bs {
                background: var(--wh);
                color: var(--bd);
                border: 1.5px solid var(--bd);
            }
            .bg {
                background: var(--gn);
                color: #fff;
            }
            .sm {
                padding: 9px 14px;
                font-size: 12px;
            }
            .g {
                display: grid;
                gap: 14px;
            }
            .g2 {
                grid-template-columns: 1fr 1fr;
            }
            .g3 {
                grid-template-columns: repeat(3, 1fr);
            }
            .card {
                border: 2px solid var(--br);
                border-radius: 14px;
                padding: 18px;
                cursor: pointer;
                background: var(--wh);
                transition: 0.15s;
            }
            .card:hover {
                border-color: var(--bdl);
            }
            .card.sel {
                border-color: var(--bd);
                background: var(--bdp);
            }
            .card h3 {
                font-family: Sora, sans-serif;
                font-size: 14px;
                margin: 8px 0 4px;
            }
            .card p {
                font-size: 12px;
                color: var(--gr);
                line-height: 1.5;
            }
            .ico {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                background: var(--bdp);
                color: var(--bd);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .lab {
                font-size: 12px;
                font-weight: 600;
                margin-bottom: 6px;
                display: block;
            }
            .inp {
                width: 100%;
                padding: 16px 18px;
                border: 2px solid var(--br);
                border-radius: 12px;
                font-size: 16px;
                font-family: inherit;
                background: var(--wh);
                outline: none;
                min-height: 54px;
            }
            .inp:focus {
                border-color: var(--bd);
                box-shadow: 0 0 0 4px rgba(232, 100, 10, 0.12);
            }
            .fg {
                margin-bottom: 16px;
            }
            .q {
                background: var(--wh);
                border: 1px solid var(--br);
                border-radius: 14px;
                padding: 20px;
                margin-bottom: 14px;
            }
            .q h4 {
                font-size: 15px;
                line-height: 1.5;
                margin-bottom: 12px;
            }
            .qn {
                font-size: 11px;
                font-weight: 700;
                color: var(--bd);
                margin-bottom: 6px;
            }
            .o {
                padding: 13px 15px;
                border: 2px solid var(--br);
                border-radius: 10px;
                margin-bottom: 8px;
                cursor: pointer;
                font-size: 14px;
                display: flex;
                gap: 10px;
                align-items: center;
                user-select: none;
            }
            .o:hover {
                border-color: var(--bdl);
                background: var(--bdp);
            }
            .o.ch {
                border-color: var(--bd);
                background: var(--bdp);
                color: var(--bd);
                font-weight: 600;
            }
            .o.ok {
                border-color: var(--gn);
                background: var(--gnl);
                color: var(--gn);
                font-weight: 600;
            }
            .o.no {
                border-color: var(--er);
                background: #fdecec;
                color: var(--er);
            }
            .o i {
                width: 18px;
                height: 18px;
                border-radius: 50%;
                border: 2px solid var(--br);
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-style: normal;
                font-size: 11px;
                font-weight: 800;
                line-height: 1;
            }
            .o.ch i {
                background: var(--bd);
                border-color: var(--bd);
            }
            .o.ok i {
                background: var(--gn);
                border-color: var(--gn);
            }
            .o.no i {
                background: var(--er);
                border-color: var(--er);
            }
            .o.ch i::after,
            .o.ok i::after {
                content: "\2713";
            }
            .o.no i::after {
                content: "\2715";
            }
            .fb {
                display: none;
                margin-top: 10px;
                padding: 10px 14px;
                border-radius: 10px;
                background: var(--gnl);
                color: var(--gn);
                font-size: 13px;
            }
            .fb.s {
                display: block;
            }
            .fb.bad {
                background: #fdecec;
                color: var(--er);
            }
            .box {
                background: var(--bdp);
                border-left: 4px solid var(--bd);
                border-radius: 0 10px 10px 0;
                padding: 14px 16px;
                font-size: 13px;
                line-height: 1.7;
                margin: 14px 0;
            }
            .hero {
                background: linear-gradient(135deg, var(--bd), var(--gd));
                color: #fff;
                border-radius: 16px;
                padding: 24px;
                text-align: center;
                margin-bottom: 18px;
            }
            .hero b {
                font-family: Sora, sans-serif;
                font-size: 52px;
            }
            .bar {
                height: 7px;
                background: var(--ivd);
                border-radius: 4px;
                overflow: hidden;
                margin: 6px 0 4px;
            }
            .bar div {
                height: 100%;
                border-radius: 4px;
                background: var(--gd);
                transition: width 0.8s;
            }
            .pm {
                display: flex;
                gap: 12px;
                margin-bottom: 14px;
            }
            .pd {
                width: 34px;
                height: 34px;
                border-radius: 50%;
                border: 2px solid var(--br);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                color: var(--gr);
            }
            .pd.c {
                background: var(--bd);
                border-color: var(--bd);
                color: #fff;
            }
            .pd.d {
                background: var(--gn);
                border-color: var(--gn);
                color: #fff;
            }
            .chip {
                display: inline-block;
                font-size: 11px;
                padding: 3px 8px;
                border-radius: 5px;
                background: var(--ivd);
                color: var(--gr);
                margin: 4px 4px 0 0;
            }
            .chat {
                border: 1px solid var(--br);
                border-radius: 12px;
                overflow: hidden;
                margin-top: 14px;
            }
            .cm {
                height: 210px;
                overflow-y: auto;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .ma,
            .mu {
                max-width: 85%;
                padding: 9px 12px;
                border-radius: 10px;
                font-size: 13px;
                line-height: 1.5;
            }
            .ma {
                background: var(--iv);
                border: 1px solid var(--br);
            }
            .mu {
                background: var(--bd);
                color: #fff;
                align-self: flex-end;
            }
            .cr {
                display: flex;
                gap: 8px;
                padding: 10px;
                border-top: 1px solid var(--br);
            }
            .cr .inp {
                min-height: 46px;
                padding: 10px 14px;
            }
            .k {
                min-width: 36px;
                height: 40px;
                background: #fff;
                border: 1.5px solid var(--br);
                border-radius: 7px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 12px;
                font-weight: 600;
                margin: 2px;
                cursor: pointer;
                user-select: none;
                padding: 0 6px;
            }
            .k.on {
                background: var(--bd);
                color: #fff;
            }
            .k.hl {
                border-color: var(--gd);
                background: var(--gdp);
                color: var(--gd);
            }
            .row {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
            }
            .cert {
                background: linear-gradient(135deg, var(--bdp), var(--gdp));
                border: 2px solid var(--gd);
                border-radius: 18px;
                padding: 30px;
                text-align: center;
            }
            .pay {
                border: 2px solid var(--br);
                border-radius: 12px;
                padding: 12px;
                text-align: center;
                cursor: pointer;
                font-size: 13px;
                font-weight: 600;
            }
            .pay.sel {
                border-color: var(--bd);
                background: var(--bdp);
            }
            .ov {
                position: fixed;
                inset: 0;
                background: rgba(26, 26, 26, 0.7);
                z-index: 90;
                display: none;
                align-items: center;
                justify-content: center;
                padding: 16px;
            }
            .ov.s {
                display: flex;
            }
            .md {
                background: #fff;
                border-radius: 20px;
                max-width: 480px;
                width: 100%;
                max-height: 90vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .tabs {
                display: flex;
                gap: 6px;
                padding: 12px 18px;
            }
            .tab {
                flex: 1;
                text-align: center;
                padding: 10px 4px;
                border-radius: 8px;
                font-size: 12px;
                font-weight: 700;
                background: var(--ivd);
                cursor: pointer;
                display: flex;
                gap: 5px;
                justify-content: center;
                align-items: center;
            }
            .tab.a {
                background: var(--bd);
                color: #fff;
            }
            .pin {
                position: absolute;
                transform: translate(-50%, -50%);
                text-align: center;
                font-size: 10px;
                font-weight: 700;
            }
            .pin i {
                display: block;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--bd);
                border: 2px solid #fff;
                margin: 0 auto;
            }
            #toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                background: var(--ch);
                color: #fff;
                padding: 12px 22px;
                border-radius: 10px;
                font-size: 13px;
                opacity: 0;
                transition: 0.3s;
                z-index: 99;
                pointer-events: none;
                max-width: 90%;
                text-align: center;
            }
            body.ph .app {
                grid-template-columns: 1fr;
                max-width: 480px;
                margin: 0 auto;
            }
            body.ph .mp {
                display: none;
            }
            @media (max-width: 900px) {
                .app {
                    grid-template-columns: 1fr;
                }
                .mp {
                    display: none;
                }
                .g2,
                .g3 {
                    grid-template-columns: 1fr;
                }
                .hd,
                .ct,
                .ft {
                    padding-left: 18px;
                    padding-right: 18px;
                }
            }
        </style>
    </head>

            /* ── QUESTIONS ── */
            function qcard(kind, qi, q) {
                const pick = S[kind][qi],
                    tx = L(q.q),
                    os = L(q.o),
                    rev = kind === "ex" && pick !== undefined,
                    right = pick === q.a;
                return `<div class="q" id="${kind}c${qi}"><div class="qn">${t("qn")} ${qi + 1}/${mod()[kind].length}</div><h4>${tx}</h4>${os.map((o, i) => `<div class="o ${rev ? (i === q.a ? "ok" : i === pick ? "no" : "") : pick === i ? "ch" : ""}" onclick="pk('${kind}',${qi},${i})"><i></i>${o}</div>`).join("")}<div class="fb ${rev ? "s" + (right ? "" : " bad") : ""}" id="${kind}f${qi}">${rev ? (right ? t("good") : t("bad")) : ""}</div></div>`;
            }
            function pk(kind, qi, i) {
                const st = S[kind],
                    m = mod(),
                    q = m[kind][qi];
                if (
                    (kind === "ex" && st[qi] !== undefined) ||
                    (kind === "ts" && S.tdone)
                )
                    return;
                st[qi] = i;
                $(kind + "c" + qi)
                    .querySelectorAll(".o")
                    .forEach((o, j) => {
                        o.className =
                            "o" +
                            (kind === "ex"
                                ? j === q.a
                                    ? " ok"
                                    : j === i
                                      ? " no"
                                      : ""
                                : j === i
                                  ? " ch"
                                  : "");
                    });
                if (kind === "ex") {
                    const f = $("exf" + qi),
                        right = i === q.a;
                    f.textContent = right ? t("good") : t("bad");
                    f.className = "fb s" + (right ? "" : " bad");
                    if (Object.keys(S.ex).length === m.ex.length) {
                        const b = $("exn");
                        if (b) b.disabled = false;
                    }
                } else if (Object.keys(S.ts).length === m.ts.length) {
                    const b = $("tsb");
                    if (b) b.disabled = false;
                }
                save();
            }
            function subTest() {
                const m = mod();
                if (S.tdone) return;
                S.tdone = 1;
                let ok = 0;
                m.ts.forEach((q, i) => {
                    if (S.ts[i] === q.a) ok++;
                    $("tsc" + i)
                        .querySelectorAll(".o")
                        .forEach((o, j) => {
                            o.className =
                                "o" +
                                (j === q.a
                                    ? " ok"
                                    : j === S.ts[i]
                                      ? " no"
                                      : "");
                        });
                });
                const pass = ok >= need(m);
                $("tr").innerHTML =
                    `<div class="fb s${pass ? "" : " bad"}">${ok}/${m.ts.length} · ${pass ? t("passed") : t("fail")}</div>`;
                const b = $("tsb");
                if (pass) {
                    b.disabled = true;
                    const nk = M[M.indexOf(m) + 1];
                    if (nk && S.open[nk.id] === undefined && S.paid)
                        S.open[nk.id] = 1;
                    setTimeout(() => {
                        if (S.step === "finaltest" && S.tdone) go("cert");
                    }, 1600);
                } else {
                    b.textContent = t("retry");
                    b.onclick = () => {
                        S.ts = {};
                        S.tdone = 0;
                        go("finaltest");
                    };
                    b.disabled = false;
                }
                save();
            }
            function fq() {
                const qs = t("qz");
                S.score = S.qa.reduce(
                    (a, v, i) => a + (qs[i] ? qs[i][2][v] || 0 : 0),
                    0,
                );
                go("results");
            }
            function lvName() {
                const s = S.score;
                if (S.acc === "lib")
                    return (
                        "Level " +
                        Math.max(1, Math.min(10, Math.round(s / 10))) +
                        "/10"
                    );
                const b = [20, 40, 55, 70, 82, 92];
                let i = b.findIndex((x) => s <= x);
                if (i < 0) i = 6;
                const lv =
                    S.lang === "fr"
                        ? F.lv
                        : S.sys === "fr"
                          ? F.lv
                          : S.sys === "rw"
                            ? [
                                  "P1-P2",
                                  "P3-P4",
                                  "P5-P6",
                                  "S1-S2",
                                  "S3-S4",
                                  "S5-S6",
                                  "Advanced",
                              ]
                            : E.lv;
                return lv[i];
            }
            function fl() {
                const s = $("rl");
                if (s)
                    s.innerHTML =
                        `<option value="">${t("sel")}</option>` +
                        LV[S.sys].map((x) => `<option>${x}</option>`).join("");
            }

            /* ── FORMS ── */
            function va() {
                const n = $("rn").value.trim(),
                    e = $("re").value.trim(),
                    p = $("rw").value;
                if (
                    !/^[A-Za-zÀ-ÖØ-öø-ÿ'\-]+(\s+[A-Za-zÀ-ÖØ-öø-ÿ'\-]+)+$/.test(
                        n,
                    )
                ) {
                    toast(t("e1"));
                    $("rn").focus();
                    return;
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)) {
                    toast(t("e2"));
                    $("re").focus();
                    return;
                }
                if (!/^(?=.*[A-Z])(?=.*[0-9]).{8,}$/.test(p)) {
                    toast(t("e3"));
                    $("rw").focus();
                    return;
                }
                S.user.name = n;
                S.qi = 0;
                S.qa = [];
                S.score = 0;
                go("quiz");
            }
            function vi() {
                const n = $("in_iname").value.trim(),
                    e = $("in_imail").value.trim();
                if (!n || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)) {
                    toast(t("er"));
                    return;
                }
                go("success");
            }
            function ab() {
                const c = $("bi").value.trim().toUpperCase();
                if (CODES.includes(c)) {
                    toast(t("bok"));
                    unlockAll();
                } else toast(t("bko"));
            }
            function pp() {
                if (paying) return;
                if (S.pm === "card") {
                    const n = ($("pcn").value || "").replace(/\D/g, ""),
                        ex = $("pcx").value.trim(),
                        cv = $("pcv").value.trim(),
                        nm = $("pcm").value.trim();
                    if (
                        n.length < 13 ||
                        n.length > 19 ||
                        !/^(0[1-9]|1[0-2])\/\d{2}$/.test(ex) ||
                        !/^\d{3,4}$/.test(cv) ||
                        nm.length < 2
                    ) {
                        toast(t("pe2"));
                        return;
                    }
                } else {
                    const p = ($("pn").value || "").replace(/\D/g, "");
                    if (p.length < 8) {
                        toast(t("pe1"));
                        return;
                    }
                }
                paying = 1;
                setTimeout(() => {
                    paying = 0;
                    toast(t("paid"));
                    unlockAll();
                }, 900);
            }
            function unlockAll() {
                S.paid = 1;
                M.forEach((m) => (S.open[m.id] = 1));
                save();
                setTimeout(() => {
                    if (S.step === "pay") go("modules");
                }, 700);
            }
            function rt2() {
                if (!S.rate) {
                    toast(t("pick"));
                    return;
                }
                $("rb").innerHTML =
                    `<div style="text-align:center;color:var(--gn);font-weight:700">${t("thx")}</div>`;
            }
            function stars() {
                const el = $("rs2");
                if (!el) return;
                el.innerHTML = [1, 2, 3, 4, 5]
                    .map(
                        (i) =>
                            `<span style="cursor:pointer;color:${i <= S.rate ? "var(--bd)" : "var(--br)"}" onclick="S.rate=${i};stars()">${ic("star", 30)}</span>`,
                    )
                    .join("");
                el.querySelectorAll("svg").forEach(
                    (s, i) =>
                        (s.style.fill = i < S.rate ? "currentColor" : "none"),
                );
            }
            function shareCert() {
                const u = location.href.split("#")[0];
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(u).then(
                        () => toast(t("lc")),
                        () => toast(t("lcf")),
                    );
                } else toast(t("lcf"));
            }
            /* chat */
            function ask(x) {
                const i = $("ci"),
                    m = (x || i.value).trim();
                if (!m) return;
                i.value = "";
                const c = $("cm");
                c.insertAdjacentHTML(
                    "beforeend",
                    `<div class="mu">${m.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</div>`,
                );
                const q = m.toLowerCase(),
                    r = t("enc").r;
                const a =
                    /phish|scam|arnaque|link|lien|click|example|exemple|protect|prot/.test(
                        q,
                    )
                        ? r.ph
                        : /pass|mot de passe|pin/.test(q)
                          ? r.pw
                          : r.df;
                setTimeout(() => {
                    c.insertAdjacentHTML(
                        "beforeend",
                        `<div class="ma">${a}</div>`,
                    );
                    c.scrollTop = c.scrollHeight;
                }, 700);
                c.scrollTop = c.scrollHeight;
            }
            /* simulator: real keyboard + on-screen */
            function lit(k) {
                const el = document.querySelector(
                    `.k[data-k="${k.toUpperCase()}"]`,
                );
                if (el) {
                    el.classList.add("on");
                    setTimeout(() => el.classList.remove("on"), 180);
                }
            }
            function goal(k) {
                if (S.sim[k]) return;
                S.sim[k] = 1;
                $("td" + k).classList.add("d");
                const both = S.sim.c && S.sim.v;
                $("sr").innerHTML = both
                    ? `<span style="color:var(--gn);font-weight:600">${t("sdone")}</span>`
                    : `<span style="color:var(--gn);font-weight:600">Ctrl + ${k.toUpperCase()} ${ic("check", 14)}</span>`;
                if (both) {
                    const b = $("smn");
                    if (b) b.disabled = false;
                }
                save();
            }
            function sk(k) {
                lit(k);
                if (k === "Ctrl") {
                    S.armed = Date.now();
                    $("sr").textContent = "Ctrl ✓";
                    return;
                }
                if ((k === "C" || k === "V") && Date.now() - S.armed < 4000)
                    goal(k.toLowerCase());
                else if (k === "C" || k === "V")
                    $("sr").textContent = t("almost");
            }
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    dc();
                    return;
                }
                if (S.step !== "simulator") return;
                const k = e.key.toLowerCase();
                lit(k === "control" ? "Ctrl" : k === " " ? "Space" : k);
                if ((e.ctrlKey || e.metaKey) && (k === "c" || k === "v"))
                    goal(k);
            });

            /* ── NAV / RENDER ── */
            function go(step) {
                S.step = step;
                render();
            }
            function render() {
                const v = V[S.step]();
                const c = COURSE[S.step];
                $("main").innerHTML =
                    (v.h
                        ? `<div class="hd"><h1>${v.h}</h1><p>${v.s || ""}</p></div>`
                        : "") +
                    `<div class="ct">${v.b}</div>` +
                    (v.f ? `<div class="ft">${v.f}</div>` : "");
                S.prim = v.p || null;
                $("pb").classList.toggle("s", !!c);
                if (c) {
                    $("pf").style.width = c + "%";
                    $("pp").textContent = c + "%";
                    $("pl").textContent = t(PL[S.step]);
                }
                if (S.step === "account") fl();
                if (S.step === "results")
                    setTimeout(
                        () =>
                            document
                                .querySelectorAll(".sf")
                                .forEach(
                                    (b) => (b.style.width = b.dataset.w + "%"),
                                ),
                        200,
                    );
                if (S.step === "cert") stars();
                chrome(v);
                save();
                window.scrollTo(0, 0);
            }
            function chrome(v) {
                $("tg").textContent = t("tag");
                $("ns").textContent = t("start");
                $("mpl").textContent = t("mobp");
                $("mob").innerHTML =
                    `<div style="font:800 14px Sora;margin-bottom:4px">${v.h || t("wel")}</div><div style="font-size:11px;color:var(--gr);line-height:1.5;margin-bottom:14px">${v.s || t("weld")}</div>${COURSE[S.step] ? `<div class="bar"><div style="width:${COURSE[S.step]}%;background:var(--bd)"></div></div>` : ""}<button class="btn bp" style="width:100%;font-size:12px" onclick="S.prim&&S.prim()">${t("cont")}</button>`;
            }
            function buildLangs() {
                $("ld").innerHTML = LANGS.map(
                    (l) =>
                        `<div class="${S.lang === l[0] ? "a" : ""}" onclick="sl('${l[0]}','${l[1]}',event)">${l[1]}</div>`,
                ).join("");
            }
            function tl(e) {
                e.stopPropagation();
                $("ld").classList.toggle("o");
            }
            document.addEventListener("click", () =>
                $("ld").classList.remove("o"),

            function sl(c, n, e) {
                e.stopPropagation();
                S.lang = c;
                $("ln").textContent = n;

                else toast(t("ml") + " " + n);
                render();
            }

            }

  <div style="text-align:center;font-size:12px;font-weight:700;color:var(--bd);margin:12px 0">${t("c17")}</div>
  ${["cb", "cr", "cbf"].map((x) => `<div class="q" style="padding:12px 14px;margin-bottom:8px;font-size:13px">${ic("pin", 15)} ${t(x)}</div>`).join("")}`;
                if (k === "lang") {
                    const draw = () => {
                        const l = LANGS[dI];
                        $("db").innerHTML =
                            `<div style="background:linear-gradient(135deg,var(--gdp),var(--bdp));border-radius:14px;padding:28px 16px;text-align:center;margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:var(--gd);margin-bottom:8px">${l[1]}</div><div style="font:800 22px Sora">${GR[l[0]]}</div></div><div class="row">${LANGS.map((x, i) => `<span class="chip" style="cursor:pointer;${i === dI ? "background:var(--bd);color:#fff" : ""}" onclick="dI=${i};dtab('lang')">${x[1]}</span>`).join("")}</div>`;
                    };
                    draw();
                    dTm = setInterval(() => {
                        dI = (dI + 1) % 8;
                        draw();
                    }, 2200);
                }
                if (k === "path")
                    $("db").innerHTML = t("j")
                        .map(
                            (j, i) =>
                                `<div class="pm"><div class="pd c">${ic(["clip", "bot", "kb", "award"][i], 16)}</div><div><b style="font-size:13px">${j[0]}</b><div style="font-size:12px;color:var(--gr)">${j[1]}</div></div></div>`,
                        )
                        .join("");
            }

            /* ── INIT ── */
            load();
            document.body.classList.toggle("ph", S.dev === "phone");
            document.documentElement.lang = S.lang;
            $("ln").textContent = (LANGS.find((l) => l[0] === S.lang) ||
                LANGS[0])[1];
            $("lbi").innerHTML = ic("globe", 16);
            $("mbi").innerHTML = ic("bell", 16);
            buildLangs();
            render();
        </script>
    </body>
</html>
